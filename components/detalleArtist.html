<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Artista</title>
    <link rel="stylesheet" href="/assets/css/detalleArtist.css">


    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/footer.css">
    <link rel="stylesheet" href="/assets/css/styles.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@1,700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

    <div class="section-1">
        <img id="foto-artist-1" src="" alt="Foto principal">
        <div class="text-overlay">
            <h1>
                <span class="primario nombre-art"></span>
                <span class="secundario nombre-art"></span>
            </h1>
            <h3 class="italic apellido-art"></h3>
        </div>
    </div>

    <div class="secciones">
        <div class="container">
            <div class="text-column">
                <div class="info-box">
                    <h1 class="artist-name nombre-art"></h1>
                    <h3 class="artist-surname apellido-art"></h3>
                    <div class="artist-description" id="artistDescription"></div>
                </div>
                <a href="#">
                    <button class="custom-button">Contacta con el artista</button>
                </a>
            </div>
            <div class="image-column">
                <img id="foto-artist-2" src="" alt="Foto del artista">
            </div>
        </div>
    </div>


    <div class="secciones">
        <div class="container">
            <div class="image-column2">
                <img id="foto-artist-3" src="" alt="">
                <p id="destacado-art"></p>
            </div>
            <div class="text-colum2">
                <h1>Premios/Menciones</h1>
                <ul id="premios-art"></ul>
            </div>
        </div>
    </div>

    <div class="secciones">
        <h1>Trabajos del Artista</h1>
        <div id="galeria-obras" class="galeria-grid"></div>

    </div>

    <div class="secciones">
        <h1>Descubra Otras Obras</h1>
        <div id="otros-autores" class="galeria-grid"></div>
    </div>
    <p id="ver_mas">"Más acerca <br> del artista"</p>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const params = new URLSearchParams(window.location.search);
            const artistId = params.get("id");

            if (!artistId) {
                console.error("No se encontró un ID en la URL");
                return;
            }

            try {
                // Cargar artistas
                const responseArtists = await fetch("../artist.json");
                const artists = await responseArtists.json();

                // Buscar el artista por ID
                const artist = artists.find(a => a.id == artistId);

                if (!artist) {
                    console.error("Artista no encontrado");
                    return;
                }

                // Actualizar los datos en la página
                document.querySelectorAll(".nombre-art").forEach(el => el.textContent = artist.name);
                document.querySelectorAll(".apellido-art").forEach(el => el.textContent = artist.surname);
                document.getElementById("artistDescription").textContent = artist.descripcion;
                document.getElementById("destacado-art").textContent = artist.destacado;

                // Cargar imágenes principales del artista
                if (artist.imags.length >= 3) {
                    document.getElementById("foto-artist-1").src = artist.imags[0];
                    document.getElementById("foto-artist-2").src = artist.imags[1];
                    document.getElementById("foto-artist-3").src = artist.imags[2];
                }

                // Mostrar premios/menciones
                const premiosList = document.getElementById("premios-art");
                artist.premios.forEach(premio => {
                    let li = document.createElement("li");
                    li.textContent = premio;
                    premiosList.appendChild(li);
                });

                // Obtener el texto overlay del elemento con id "ver_mas"
                const textoVerMas = document.getElementById("ver_mas").innerHTML;

                // Cargar obras del artista
                const responseObras = await fetch("../obras.json");
                const obras = await responseObras.json();

                const obrasArtista = obras.filter(o => artist.obras.includes(o.id_img));
                const galeria = document.getElementById("galeria-obras");

                // Crear las tarjetas de obras del artista
                obrasArtista.forEach(obra => {
                    let obraDiv = document.createElement("div");
                    obraDiv.classList.add("obra-card");
                    obraDiv.dataset.idImg = obra.id_img;

                    let img = document.createElement("img");
                    img.src = obra.img[0];
                    img.alt = obra.titulo;

                    // Crear el elemento de texto overlay
                    let overlayText = document.createElement("div");
                    overlayText.classList.add("overlay-text");
                    overlayText.innerHTML = textoVerMas;

                    let info = document.createElement("div");
                    info.classList.add("obra-info");
                    info.innerHTML = `
                <h3>"${obra.titulo}"</h3>
                <p>${obra.autor}</p>
                <p>${obra.tipo}</p>
                <p>${obra.tamano}</p>
                <p>${obra.estado}</p>
                <p>${obra.precio} Bs.</p>
            `;

                    obraDiv.appendChild(img);
                    obraDiv.appendChild(overlayText);
                    obraDiv.appendChild(info);
                    galeria.appendChild(obraDiv);

                    // Agregar evento de clic para redirigir a la página de detalle
                    obraDiv.addEventListener("click", function () {
                        window.location.href = `detalle.html?id=${obra.id_img}`;
                    });
                });

                // Cargar otras obras aleatorias
                const otrasObras = obras.filter(o => !artist.obras.includes(o.id_img));
                const otrasObrasRandom = otrasObras.sort(() => 0.5 - Math.random()).slice(0, 4);
                const otrosAutores = document.getElementById("otros-autores");

                // Crear las tarjetas de otras obras
                otrasObrasRandom.forEach(obra => {
                    let obraDiv = document.createElement("div");
                    obraDiv.classList.add("obra-card");
                    obraDiv.dataset.idImg = obra.id_img;

                    let img = document.createElement("img");
                    img.src = obra.img[0];
                    img.alt = obra.titulo;

                    // Crear el elemento de texto overlay usando el mismo texto
                    let overlayText = document.createElement("div");
                    overlayText.classList.add("overlay-text");
                    overlayText.innerHTML = textoVerMas;

                    let info = document.createElement("div");
                    info.classList.add("obra-info");
                    info.innerHTML = `
                <h3>${obra.titulo}</h3>
                <p>${obra.autor}</p>
                <p>${obra.tipo}</p>
                <p> ${obra.tamano}</p>
                <p>${obra.estado}</p>
                <p> ${obra.precio} Bs.</p>
            `;

                    obraDiv.appendChild(img);
                    obraDiv.appendChild(overlayText);
                    obraDiv.appendChild(info);
                    otrosAutores.appendChild(obraDiv);

                    // Agregar evento de clic para redirigir a la página de detalle
                    obraDiv.addEventListener("click", function () {
                        window.location.href = `detalle.html?id=${obra.id_img}`;
                    });
                });

                // Ocultar el párrafo original "ver_mas" si está en uso en las tarjetas
                document.getElementById("ver_mas").style.display = "none";
            } catch (error) {
                console.error("Error al cargar los datos:", error);
            }
        });
    </script>

    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/navbar.js"></script>
    <script src="/assets/js/footer.js"></script>


</body>

</html>
